name: ADHS Appointment Checker

on:
  schedule:
    # Every 30 min, Mon–Fri, 07:00–19:30 German time (CEST = UTC+2)
    - cron: '0,30 5-17 * * 1-5'
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  check-appointments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-adhs

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          pip install playwright
          playwright install --with-deps chromium

      - name: Run appointment checker
        id: check
        continue-on-error: true   # exit 1 (nothing found) must not fail the job
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}   # your Brevo login email
          SMTP_PASS: ${{ secrets.SMTP_PASS }}   # Brevo SMTP key (not your account password)
        run: python adhs_notifier/checker.py

      # Only runs when checker exits 0 (appointment or booking page found)
      - name: Create GitHub issue notification
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `ADHS Termin verfügbar! – ${today}`;

            // Avoid duplicate issues on the same day
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'adhs-notifier',
            });
            if (existing.data.some(i => i.title === title)) {
              console.log('Issue for today already exists, skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Früher Termin verfügbar!',
                '',
                'Das automatische Monitoring hat einen möglichen Termin **vor dem 15.06.2026** entdeckt.',
                '',
                '**Jetzt prüfen und buchen:** https://adhs-spezialambulanz.de/',
                '',
                `_Automatisch gefunden am ${today}_`,
              ].join('\n'),
              labels: ['adhs-notifier'],
            });
